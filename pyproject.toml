[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "smashpdf"
version = "1.0.0"
description = "Local Windows PDF unlocker with optional lossless compression"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dklicious" }]
dependencies = [
  "pypdf[crypto]==6.14.2",
  "tkinterdnd2==0.6.2",
]

[project.urls]
Homepage = "https://github.com/dklicious/SmashPDF"
Repository = "https://github.com/dklicious/SmashPDF"
Issues = "https://github.com/dklicious/SmashPDF/issues"

[project.scripts]
smashpdf = "smashpdf:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
