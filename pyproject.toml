[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "smashpdf"
dynamic = ["version"]
description = "Local Windows PDF and picture compression and protection tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dklicious" }]
dependencies = [
  "pillow==12.3.0",
  "pypdf[crypto]==6.16.1",
  "tkinterdnd2==0.6.2",
]

[project.urls]
Homepage = "https://github.com/dklicious/SmashPDF"
Repository = "https://github.com/dklicious/SmashPDF"
Issues = "https://github.com/dklicious/SmashPDF/issues"

[project.scripts]
smashpdf = "smashpdf:main"

[tool.setuptools]
py-modules = ["smashpdf", "_version"]

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["smashpdf"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
